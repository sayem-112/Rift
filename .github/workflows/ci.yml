name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rift
          POSTGRES_PASSWORD: rift
          POSTGRES_DB: rift
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rift"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://rift:rift@localhost:5432/postgres?sslmode=disable
      TEST_S3_ENDPOINT: http://localhost:7070
    steps:
      - uses: actions/checkout@v4
      # Service containers can't take a command, so the S3 gateway starts here.
      - name: Start S3 (versitygw)
        run: docker run -d --name s3 -p 7070:7070 -v s3data:/data versity/versitygw:v1.8.0 --access rift --secret rift-dev-secret posix /data
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Generated code is up to date
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc diff
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: server
      - name: Test (unit + integration, race detector)
        run: go test -race -count=1 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
