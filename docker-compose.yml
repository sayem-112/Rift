# Local development services. Start with: docker compose up -d
name: rift

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rift}
      POSTGRES_DB: ${POSTGRES_DB:-rift}
    ports:
      # 5433 on the host, so it never collides with a locally installed Postgres.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rift} -d ${POSTGRES_DB:-rift}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible stand-in for Cloudflare R2: versitygw over a local filesystem.
  # (MinIO stopped publishing community images in 2025.) It validates SigV4
  # signatures, including presigned URLs, like the real thing. The API server
  # creates the bucket on startup when S3_CREATE_BUCKET=true.
  s3:
    image: versity/versitygw:v1.8.0
    restart: unless-stopped
    command: ["--access", "${S3_ACCESS_KEY:-rift}", "--secret", "${S3_SECRET_KEY:-rift-dev-secret}", "--cors-allow-origin", "${RIFT_WEB_URL:-http://localhost:5173}", "posix", "/data"]
    ports:
      - "7070:7070"
    volumes:
      - s3data:/data

volumes:
  pgdata:
  s3data:
